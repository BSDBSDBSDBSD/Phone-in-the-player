name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + Magisk module
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest packageMagiskModule

      - name: Collect files
        run: cp "$(ls app/build/outputs/apk/release/*.apk | head -n 1)" app/build/outputs/magisk/PhoneLink.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLink-apk
          path: app/build/outputs/magisk/PhoneLink.apk
          if-no-files-found: error

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLink-magisk
          path: app/build/outputs/magisk/PhoneLink-magisk.zip
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # The newest module from main, under a stable download link
      - name: Publish latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest app/build/outputs/magisk/PhoneLink-magisk.zip app/build/outputs/magisk/PhoneLink.apk -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest --title "PhoneLink – latest" \
            --notes "Built from ${GITHUB_SHA::7}. Either install PhoneLink-magisk.zip in Magisk (Modules → Install from storage), or install PhoneLink.apk and press 'Install as system app' in its System check screen (needs a writable /system). Then restart the player."
